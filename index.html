        // ========== ANIMATED COUNTER ==========
        function AnimatedCounter({ target, suffix }) {
            const [val, setVal] = useState(0);
            const ref = useRef(null);
            const ran = useRef(false);
            useEffect(() => {
                const obs = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting && !ran.current) {
                        ran.current = true;
                        const dur = 1800, t0 = performance.now();
                        function tick(now) {
                            const p = Math.min((now - t0) / dur, 1);
                            setVal(Math.round((1 - Math.pow(1 - p, 3)) * target));
                            if (p < 1) requestAnimationFrame(tick);
                        }
                        requestAnimationFrame(tick);
                    }
                }, { threshold: 0.2 });
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, [target]);
            return <span ref={ref} className="stat-counter">{fmtFull(val)}{suffix && <span style={{fontSize:'0.6em',opacity:0.7,marginLeft:4}}>{suffix}</span>}</span>;
        }

                                                <Tooltip formatter={v => fmtTonnes(v)} />
                                                <Bar dataKey="cargo" fill="#0a8f93" radius={[4,4,0,0]} isAnimationActive={false} />
                                            </BarChart>
                                        </ResponsiveContainer>
                                    </div>
                                </div>

                                <div style={{display:'grid',gridTemplateColumns:'repeat('+selected.length+',1fr)',gap:16}}>
                                    {selected.map(port => {
                                        const g = pctChange(port.data[3].t, port.data[4].t);
                                        return (
                                            <div key={port.id} className="section-card">
                                                <h4 style={{fontWeight:700,marginBottom:12,fontSize:'0.95rem'}}>{port.name}</h4>
                                                <div style={{display:'grid',gap:8,fontSize:'0.85rem'}}>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>2025 Cargo:</span><span style={{fontWeight:600}}>{fmtTonnes(port.data[4].t)}</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>2025 Berthings:</span><span style={{fontWeight:600}}>{fmtFull(port.data[4].b)}</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>YoY Growth:</span><span style={{fontWeight:600,color:g>=0?'#0a8f93':'#d6584f'}}>{g>=0?'+':''}{g}%</span></div>
                                                    <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'#6b7280'}}>Top Cargo:</span><span style={{fontWeight:600}}>{port.cargoes[0][0]}</span></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {selected.length < 2 && (
                            <div className="section-card" style={{textAlign:'center',padding:48,color:'#9ca3af'}}>
                                <p>Select at least 2 ports above to compare.</p>
                            </div>
                        )}
                    </div>
                </section>
            );
        }

        // ========== PORT DETAILS MODAL ==========
        function PortModal({ port, onClose }) {
            if (!port) return null;
            const c25 = port.data[4].t, c24 = port.data[3].t;
            const yoy = pctChange(c24, c25);
            const cumG = pctChange(port.data[0].t, c25);
            const isPublic = port.type === 'Porto Organizado';

            return (
                <div className="modal-overlay" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="modal-content">
                        <div style={{background:'linear-gradient(135deg, #020617, #0a8f93)',color:'#fff',padding:'32px',borderRadius:'16px 16px 0 0',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                            <div>
                                <h2 style={{fontSize:'1.5rem',fontWeight:800,marginBottom:4}}>{port.name}</h2>
                                <p style={{opacity:0.7,fontSize:'0.9rem'}}>{port.city}, {port.state}</p>
                                <span className={`badge ${isPublic?'badge-public':'badge-terminal'}`} style={{marginTop:8}}>{isPublic ? 'Public Port' : 'Authorised Terminal'}</span>
                            </div>
                            <button onClick={onClose} style={{background:'rgba(255,255,255,0.2)',border:'none',color:'#fff',borderRadius:8,width:36,height:36,cursor:'pointer',fontSize:'1.2rem',display:'flex',alignItems:'center',justifyContent:'center'}}>X</button>
                        </div>

                        <div style={{padding:32}}>
                            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:32}}>
                                <div className="kpi-card"><p className="kpi-label">2025 Cargo</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtTonnes(c25)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">2024 Cargo</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtTonnes(c24)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">Berthings 2025</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(port.data[4].b)}</p></div>
                                <div className="kpi-card"><p className="kpi-label">YoY Growth</p><p className="kpi-value" style={{fontSize:'1.3rem',color:yoy>=0?'#0a8f93':'#d6584f'}}>{yoy>=0?'+':''}{yoy}%</p></div>
                            </div>

                            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:32}}>
                                <div>
                                    <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Top 5 Cargoes</h3>
                                    {port.cargoes.map(([name, pct], i) => (
                                        <div key={i} style={{marginBottom:12}}>
                                            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                                                <span style={{fontSize:'0.8rem',fontWeight:500,color:'#374151'}}>{name}</span>
                                                <span style={{fontSize:'0.8rem',fontWeight:700,color:'#0a8f93'}}>{pct}%</span>
                                            </div>
                                            <div className="progress-bar"><div className="progress-fill" style={{width:pct+'%'}}></div></div>
                                        </div>
                                    ))}
                                </div>
                                <div>
                                    <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Port Information</h3>
                                    <div style={{display:'grid',gap:10,fontSize:'0.85rem'}}>
                                        {[
                                            ['Rank', port.rank + ' / 20'],
                                            ['Type', port.type],
                                            ['Region', port.region],
                                            ['State', port.sc],
                                            ['5-Year Growth', (cumG>=0?'+':'') + cumG + '%'],
                                        ].map(([k,v], i) => (
                                            <div key={i} style={{display:'flex',justifyContent:'space-between',borderBottom:'1px solid #f3f4f6',paddingBottom:8}}>
                                                <span style={{color:'#6b7280'}}>{k}</span><span style={{fontWeight:600}}>{v}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {VESSEL_INTEL[port.id] && (
                                <div style={{marginBottom:32}}>
                                    <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Vessel Call Intelligence ({VESSEL_INTEL[port.id].anos})</h3>
                                    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
                                        <div className="kpi-card"><p className="kpi-label">Vessel Calls</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(VESSEL_INTEL[port.id].calls)}</p></div>
                                        <div className="kpi-card"><p className="kpi-label">Unique Vessels</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(VESSEL_INTEL[port.id].ships)}</p></div>
                                        <div className="kpi-card"><p className="kpi-label">Avg DWT</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(VESSEL_INTEL[port.id].dwt)}</p></div>
                                        {VESSEL_INTEL[port.id].co2 && <div className="kpi-card"><p className="kpi-label">CO2 at Berth (t)</p><p className="kpi-value" style={{fontSize:'1.3rem'}}>{fmtFull(VESSEL_INTEL[port.id].co2)}</p></div>}
                                    </div>
                                    <p style={{fontSize:'0.72rem',color:'#9ca3af',marginTop:8}}>IMO-matched berthing records with deadweight tonnage. CO2 estimated for auxiliary engines at berth (IMO 4th GHG Study method).</p>
                                </div>
                            )}
                            <div style={{marginBottom:24}}>
                                <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Annual Cargo Movement</h3>
                                <ResponsiveContainer width="100%" height={250}>
                                    <LineChart data={port.data}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                        <XAxis dataKey="y" />
                                        <YAxis tickFormatter={v => fmt(v)} />
                                        <Tooltip formatter={v => fmtTonnes(v)} />
                                        <Line type="monotone" dataKey="t" stroke={port.color} strokeWidth={2.5} dot={{r:5,fill:port.color}} isAnimationActive={false} name="Cargo" />
                                    </LineChart>
                                </ResponsiveContainer>
                            </div>

                            <div>
                                <h3 style={{fontWeight:700,marginBottom:16,fontSize:'1rem'}}>Annual Berthings</h3>
                                <ResponsiveContainer width="100%" height={200}>
                                    <BarChart data={port.data}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                                        <XAxis dataKey="y" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="b" fill={port.color} radius={[4,4,0,0]} isAnimationActive={false} name="Berthings" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ========== ALL FACILITIES DATA ==========
        function AllDataSection({ onSelectPort }) {
            const [q, setQ] = useState('');
            const [ftype, setFtype] = useState('all');
            const [sortKey, setSortKey] = useState('c25');
            const [asc, setAsc] = useState(false);
            const totalAll = ALL_FACILITIES.reduce((t, f) => t + (f.c25 || 0), 0);
            let rows = ALL_FACILITIES.filter(f =>
                (ftype === 'all' || (ftype === 'public' ? f.pub : !f.pub)) &&
                f.n.toLowerCase().includes(q.toLowerCase()));
            rows = [...rows].sort((a, b) => {
                const va = a[sortKey] == null ? -1 : a[sortKey], vb = b[sortKey] == null ? -1 : b[sortKey];
                return (asc ? 1 : -1) * ((va > vb) - (va < vb));
            });
            const thStyle = {padding:'10px 8px',fontSize:'0.72rem',textTransform:'uppercase',letterSpacing:0.5,color:'#6b7280',cursor:'pointer',textAlign:'right',whiteSpace:'nowrap',fontFamily:'DM Sans',userSelect:'none'};
            const Th = ({label, k, left}) => (
                <th style={{...thStyle, textAlign: left ? 'left' : 'right'}}
                    onClick={() => { if (sortKey === k) setAsc(!asc); else { setSortKey(k); setAsc(false); } }}>
                    {label}{sortKey === k ? (asc ? ' ↑' : ' ↓') : ''}
                </th>
            );
            const fmtMt = v => v == null ? '—' : v.toFixed(2);
            const grw = f => (f.c24 && f.c25 != null) ? ((f.c25 - f.c24) / f.c24 * 100) : null;
            return (
                <section id="data" style={{padding:'80px 20px',background:'#fff'}}>
                    <div style={{maxWidth:1200,margin:'0 auto'}}>
                        <h2 style={{fontSize:'2rem',fontWeight:800,marginBottom:8}}>All Ports & Terminals</h2>
                        <p style={{color:'#6b7280',fontSize:'0.9rem',marginBottom:32}}>Complete official ANTAQ cargo statistics for {ALL_FACILITIES.length} Brazilian port facilities, 2023-2025 (million tonnes). Rows in teal belong to the Top 20 dashboard - click to open details.</p>
                        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:20,alignItems:'center'}}>
                            <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search facility..."
                                style={{padding:'10px 14px',borderRadius:8,border:'1px solid #e5e7eb',fontSize:'0.875rem',fontFamily:'Source Sans 3',minWidth:240}} />
                            {[['all','All'],['public','Public Ports'],['private','Private Terminals']].map(([key,label]) => (
                                <button key={key} className={'filter-btn ' + (ftype === key ? 'active' : '')} onClick={() => setFtype(key)}>{label}</button>
                            ))}
                            <span style={{fontSize:'0.8rem',color:'#9ca3af',marginLeft:'auto'}}>{rows.length} facilities · {(totalAll/1000).toFixed(2)} billion tonnes in 2025</span>
                        </div>
                        <div className="section-card" style={{padding:0,overflowX:'auto'}}>
                            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'0.85rem'}}>
                                <thead>
                                    <tr style={{borderBottom:'2px solid #e5e7eb'}}>
                                        <th style={{...thStyle,textAlign:'right',width:40}}>#</th>
                                        <Th label="Facility" k="n" left={true} />
                                        <Th label="UF" k="uf" left={true} />
                                        <Th label="Type" k="pub" left={true} />
                                        <Th label="2023" k="c23" />
                                        <Th label="2024" k="c24" />
                                        <Th label="2025" k="c25" />
                                        <Th label="Share 2025" k="c25" />
                                        <th style={thStyle}>{'Δ'} 25/24</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows.map((f, i) => {
                                        const g = grw(f);
                                        const isT20 = !!f.pid;
                                        return (
                                            <tr key={f.n} onClick={() => isT20 && onSelectPort(f.pid)}
                                                style={{borderBottom:'1px solid #f3f4f6',background: isT20 ? '#eefafa' : 'transparent',cursor: isT20 ? 'pointer' : 'default'}}>
                                                <td style={{padding:'8px',textAlign:'right',color:'#9ca3af'}}>{i + 1}</td>
                                                <td style={{padding:'8px',fontWeight: isT20 ? 700 : 500,color: isT20 ? '#0a8f93' : '#13343b'}}>{f.n}</td>
                                                <td style={{padding:'8px',color:'#6b7280'}}>{f.uf}</td>
                                                <td style={{padding:'8px'}}><span className={'badge ' + (f.pub ? 'badge-public' : 'badge-terminal')}>{f.pub ? 'Public' : 'Private'}</span></td>
                                                <td style={{padding:'8px',textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmtMt(f.c23)}</td>
                                                <td style={{padding:'8px',textAlign:'right',fontVariantNumeric:'tabular-nums'}}>{fmtMt(f.c24)}</td>
                                                <td style={{padding:'8px',textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums'}}>{fmtMt(f.c25)}</td>
                                                <td style={{padding:'8px',textAlign:'right',color:'#6b7280',fontVariantNumeric:'tabular-nums'}}>{f.c25 != null ? (f.c25 / totalAll * 100).toFixed(2) + '%' : '—'}</td>
                                                <td style={{padding:'8px',textAlign:'right',fontWeight:600,fontVariantNumeric:'tabular-nums',color: g == null ? '#9ca3af' : g >= 0 ? '#0a8f93' : '#d6584f'}}>{g == null ? '—' : (g >= 0 ? '+' : '') + g.toFixed(1) + '%'}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                        <p style={{fontSize:'0.75rem',color:'#9ca3af',marginTop:12}}>Source: ANTAQ official annual statistics (consolidated research base). Values in million tonnes of gross cargo.</p>
                    </div>
                </section>
            );
        }

        // ========== ABOUT ==========
        function AboutSection() {
            return (
                <section id="about" style={{padding:'80px 20px',background:'#fff'}}>
                    <div style={{maxWidth:1000,margin:'0 auto'}}>
                        <h2 style={{fontSize:'2rem',fontWeight:800,marginBottom:40}}>About</h2>

                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:24,marginBottom:48}}>
                            <div className="section-card">
                                <h3 style={{fontWeight:700,fontSize:'1.1rem',marginBottom:12}}>Project Overview</h3>
                                <p style={{color:'#4b5563',lineHeight:1.7,fontSize:'0.9rem'}}>
                                    This analytics dashboard covers Brazil's entire port system: official ANTAQ cargo statistics for all 211 port facilities (2023-2025) and detailed operational profiles of the 20 largest ports and terminals (2021-2025), including public ports and authorised terminals. It enables port operators, researchers, and policymakers to analyse trends and compare facilities nationwide.
                                </p>
                            </div>
                            <div className="section-card" style={{borderLeft:'4px solid #00bfc0'}}>
                                <h3 style={{fontWeight:700,fontSize:'1.1rem',marginBottom:12}}>About the Researcher</h3>
                                <p style={{fontWeight:600,color:'#111827',marginBottom:8}}>Darliane Cunha, PhD</p>
                                <p style={{color:'#4b5563',lineHeight:1.7,fontSize:'0.9rem',marginBottom:12}}>
                                    Researcher in maritime sustainability, port governance, and environmental analytics with 20+ years of experience.
                                </p>
                                <a href="mailto:darlianerc@gmail.com" style={{color:'#0a8f93',fontWeight:600,fontSize:'0.85rem',textDecoration:'none'}}>darlianerc@gmail.com</a>
                            </div>
                        </div>

                        <div className="section-card" style={{background:'#f9fafb',marginBottom:32}}>
                            <h3 style={{fontWeight:700,marginBottom:8,fontSize:'0.95rem'}}>Data Source</h3>
                            <p style={{color:'#4b5563',fontSize:'0.85rem',lineHeight:1.7}}><strong>ANTAQ</strong> (Agencia Nacional de Transportes Aquaviarios) - National Waterway Transportation Agency, official Brazilian agency for waterway regulation. Cargo figures for 2023-2025 are official full-year statistics from ANTAQ's consolidated annual tables covering all Brazilian port facilities; all series and berthing counts come from the same ANTAQ definition (authorised cargo operations), extracted from the ANTAQ statistical panel in September 2026. The All Ports & Terminals table covers every facility reported by ANTAQ (2023-2025). Vessel Call Intelligence combines ANTAQ berthing records with IMO ship registry deadweight data (Itaguai, Itaqui, Paranagua and Vila do Conde) and at-berth CO2 estimated with the IMO Fourth GHG Study method. Last update: July 2026.</p>
                        </div>
                    </div>
                </section>
            );
        }

        // ========== APP ==========
        function App() {
            const [selectedPort, setSelectedPort] = useState(null);
            const handleNavigate = (id) => {
                const el = document.getElementById(id);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            };

            return (
                <div>
                    <HeroSection onNavigate={handleNavigate} />
                    <NavBar onNavigate={handleNavigate} />
                    <OverviewSection onSelectPort={setSelectedPort} />
                    <ComparisonSection />
                    <AllDataSection onSelectPort={setSelectedPort} />
                    <AboutSection />
                    <footer style={{background:'#020617',color:'#fff',padding:'32px 20px',textAlign:'center'}}>
                        <p style={{color:'#76828b',fontSize:'0.8rem',marginBottom:6}}>Brazil Ports & Terminals Dashboard - Data: ANTAQ Estatístico Aquaviário, full years 2021-2025, extracted September 2026</p>
                        <p style={{color:'#bfc5ca',fontSize:'0.8rem'}}>Developed by <a href="https://ribeirocunha.com/" target="_blank" rel="noopener" style={{color:'#00bfc0',fontWeight:600,textDecoration:'none'}}>Darliane Ribeiro Cunha, PhD</a></p>
                    </footer>
                    {selectedPort && <PortModal port={PORTS.find(p => p.id === selectedPort)} onClose={() => setSelectedPort(null)} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
